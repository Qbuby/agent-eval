# OmniAgent v1 作为 agent-eval 系统智能体的最小运行配置。
# skill、业务工具与提示词增强后续单独设计；当前只启用基础 HTTP 对话与 PG 会话持久化。
postgres:
  host: "${DB_HOST:-postgres}"
  port: 5432
  database: "omniagent"
  user: "${DB_USER:-postgres}"
  password: "${DB_PASSWORD:-postgres}"
  sslmode: "${DB_SSLMODE:-disable}"

agent:
  default_model: "${OMNIAGENT_MODEL:-gpt-5.6-terra}"
  # v1 的 tools 空列表表示启用全部工具。使用不可能命中的非空白名单保持零工具；
  # HTTP 入口本身也不会暴露 ask/审批能力。
  tools: ["__no_tools_until_designed__"]
  disabled_tools: []
  max_tokens: 8192
  recursion_limit: 20
  subagent_depth: 0
  checkpointer: "postgres"
  message_cache_enabled: false

llm_params:
  openai:
    temperature: 0.2
    timeout: 120
    max_retries: 0

schedule:
  enabled: false

channels:
  feishu:
    enabled: false
  wecom:
    enabled: false
  gateway:
    enabled: false

dream:
  auto_dream:
    enabled: false
  daily_dream:
    enabled: false
