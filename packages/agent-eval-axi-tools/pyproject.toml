[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-axi-tools"
version = "0.1.0"
description = "Reviewed Axi native tools for Agent Eval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.5",
]

[project.entry-points."axi.native_tools"]
data = "agent_eval_axi_tools.data"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_axi_tools"]
